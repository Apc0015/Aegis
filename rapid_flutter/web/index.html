<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RAPID — Enterprise RAG with Role-Based Access Control">
  <title>RAPID</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #F9FAFB;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      flex-direction: column;
      gap: 16px;
      color: #6B7280;
      font-size: 14px;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #E5E7EB;
      border-top: 3px solid #6366F1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    // Store API base URL from build-time dart-define
    window.rapidApiBase = '{{API_BASE_URL}}' || 'http://localhost:8000';
  </script>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <span>Loading RAPID…</span>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
