name: rapid_flutter
description: RAPID — Enterprise RAG Web UI
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # HTTP client + SSE streaming
  dio: ^5.4.3
  http: ^1.2.2

  # Secure local storage (JWT token)
  flutter_secure_storage: ^9.2.2

  # File upload + drag-drop
  file_picker: ^8.1.2
  desktop_drop: ^0.4.4

  # UI / animations
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  # Charts (confidence donut + trend lines)
  fl_chart: ^0.68.0

  # Paginated data table (audit log)
  data_table_2: ^2.5.15

  # Markdown rendering (answer text)
  flutter_markdown: ^0.7.3

  # Google Fonts (Inter)
  google_fonts: ^6.2.1

  # Date formatting
  intl: ^0.19.0

  # UUID generation
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
