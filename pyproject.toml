[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
version = "1.0.0"
description = "Aegis — Enterprise RAG system with role-based access control and a data firewall"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
